<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>Lists and Tables</title>
</head>

<body>

    <h2>Top Programming Languages</h2>

    <ul>
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
    </ul>

    <h2>Student Marks Table</h2>

    <table border="1" cellpadding="5">
        <tr>
            <th>Student Name</th>
            <th>Marks</th>
        </tr>

        <tr>
            <td>ankit</td>
            <td>75</td>
        </tr>
    </table>

</body>

</html>
